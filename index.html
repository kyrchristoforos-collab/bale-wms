<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECORECOVERY WMS</title><link rel="stylesheet" href="style.css"></head><body><header><h1>ECORECOVERY <small>BALE WMS</small></h1><span id="who"></span></header><main><section id="setup" class="panel"><h2>Σύνδεση Supabase</h2><p>Συμπλήρωσε το Project URL και το publishable/anon key από το Supabase → Project Settings → API. Μην βάλεις service_role key.</p><label>Project URL<input id="url" placeholder="https://xxxxx.supabase.co"></label><label>Publishable / anon key<input id="key" type="password"></label><button id="saveConfig">Αποθήκευση σύνδεσης</button></section><section id="auth" class="panel hidden"><h2>Σύνδεση χρήστη</h2><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button id="login">Σύνδεση</button><p>Δημιούργησε τους χρήστες από Supabase → Authentication → Users. Απενεργοποίησε δημόσια εγγραφή χρηστών.</p></section><div id="app" class="hidden"><nav><button data-page="home">Αρχική</button><button data-page="receipt">Παραλαβή</button><button data-page="scan">Λύσιμο Bale</button><button data-page="inventory">Απόθεμα</button><button data-page="receipts">Παραλαβές</button><button data-page="settings">Ρυθμίσεις</button><button id="logout">Έξοδος</button></nav><section id="view"></section></div><p id="msg" role="status"></p></main><script type="module" src="app.js"></script></body></html>
